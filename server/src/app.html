<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/images/vibes-icon.png" />
    <link rel="apple-touch-icon" href="/images/vibes-icon@2x.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060709" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f8" />
    <script>
      (function() {
        let theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        // Dark is the default; only an explicit saved 'light' choice opts out.
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <title>Vibes</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
